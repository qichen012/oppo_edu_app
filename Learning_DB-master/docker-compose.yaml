services:
  db:
    image: mysql:8.0
    container_name: learning_db
    restart: always
    environment:
      MYSQL_DATABASE: Learning_DB
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./Learning_DB.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: .
    container_name: learning_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://appuser:password@db:3306/Learning_DB
      - ENVIRONMENT=docker
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  mysql_data: